[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Dynet API and CLI Rust workspace members."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["README.md"]
note = "Public introduction."

[[layout.file]]
name = [".gitattributes"]
note = "Git line-ending policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Rust workspace anchors and the toolchain wharf builds with."

[release]
product = "dynet"
authority = "https://releases.dynet.perish.uk"
binaries = ["dynet"]
targets = ["x86_64-unknown-linux-gnu"]

[workflow.hash.guard]
"rust" = ["suite://cargo"]
"ectropy" = ["ectropy.toml", "crates"]
"plumb" = ["*"]
