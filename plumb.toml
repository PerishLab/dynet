[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The Dynet API and CLI Rust workspace members."

[[layout.seat]]
path = "packaging/apk"
anchor = ["package.toml"]
note = "OpenWrt APK metadata consumed by Wharf; installation leaves capture disabled."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["DESIGN.md"]
note = "Configuration trust, application and operational contracts."

[[layout.file]]
name = ["README.md"]
note = "Public introduction."

[[layout.file]]
name = [".gitattributes"]
note = "Git line-ending policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[identity]
ns = "dynet"

[release]
authority = "https://releases.dynet.perish.uk"
binaries = ["dynet"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "aarch64-unknown-linux-musl"]

[workflow.hash.guard]
"rust" = ["suite://cargo"]
"ectropy" = ["ectropy.toml", "crates"]
"plumb" = ["*"]

[release.windows]
scope = "machine"

[release.apk]
binary = "dynet"
root = "packaging/apk"
profile = "openwrt-aarch64-cortex-a53"
