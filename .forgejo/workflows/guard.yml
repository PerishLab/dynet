name: guard

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Guard
        run: |
          set -eu
          plumb doctor .
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets --release
          cargo test --locked --workspace
          ectropy .

  windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust guard
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
