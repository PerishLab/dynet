[workspace]
resolver = "3"
members = ["crates/api", "crates/cli", "crates/lib"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/dynet"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dynet-api = { path = "crates/api" }
dynet-core = { path = "crates/lib" }
plumb = { version = "0", registry = "perish", default-features = false }
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
blake3 = { version = "1", default-features = false }
md-5 = "0.10"
signal-hook = { version = "0.3", default-features = false }
socket2 = { version = "0.5", features = ["all"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "phy-tuntap_interface", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
