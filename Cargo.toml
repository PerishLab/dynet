[workspace]
resolver = "3"
members = ["crates/api", "crates/cli", "crates/lib", "crates/tun"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/dynet"

[workspace.dependencies]
locus = { version = "0", registry = "perish" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
dynet-api = { path = "crates/api" }
dynet-core = { path = "crates/lib" }
dynet-tun = { path = "crates/tun" }
plumb = { version = "0", registry = "perish", default-features = false, features = ["observation"] }
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
blake3 = { version = "1", default-features = false, features = ["pure"] }
md-5 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
ml-kem = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
signal-hook = { version = "0.3", default-features = false }
socket2 = { version = "0.5", features = ["all"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
