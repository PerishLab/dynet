[comment]
allow = false

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[[grant]]
paths = ["crates/tun/src/windows/resource.rs"]
syntax = "embed"

[[grant]]
paths = ["crates/tun/src/windows/resource.rs"]
syntax = "environment"

[[grant]]
paths = ["crates/api/src/host/windows/place.rs"]
syntax = "environment"

[[grant]]
paths = ["crates/cli/src/platform/macos/service.rs"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = ["crates/**/*.rs"]

[word]
single = true
